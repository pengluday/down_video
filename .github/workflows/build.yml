# Video Downloader - 自动打包工作流

name: Build Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller fastapi uvicorn yt-dlp requests pydantic python-multipart pywebview

    - name: Create directories
      run: |
        mkdir -p static

    - name: Build executable
      run: |
        pyinstaller --onefile --name "video-downloader" \
        --add-data "static:static" \
        --hidden-import uvicorn \
        --hidden-import yt_dlp \
        --hidden-import "uvicorn.logging" \
        --hidden-import "uvicorn.loops" \
        --hidden-import "uvicorn.loops.auto" \
        --hidden-import "uvicorn.protocols" \
        --hidden-import "uvicorn.protocols.http" \
        --hidden-import "uvicorn.protocols.http.httptools" \
        --hidden-import "uvicorn.protocols.websockets" \
        --hidden-import "uvicorn.protocols.websockets.auto" \
        --hidden-import "uvicorn.lifespan" \
        --hidden-import "uvicorn.lifespan.on" \
        main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: video-downloader-${{ matrix.os }}
        path: dist/
